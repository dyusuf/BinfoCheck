[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "binfocheck"
version = "0.1.0"
description = "Shared evidence contracts for BinfoCheck"
requires-python = ">=3.13,<3.14"
dependencies = [
    "beautifulsoup4==4.15.0",
    "html5lib==1.1",
    "jsonschema>=4.23,<5",
    "llama-index-core==0.14.24",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.2,<2",
    "spacy==3.8.16",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.12,<1", "pyright[nodejs]>=1.1.400,<2", "types-jsonschema>=4.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
